name: Sync and build APK

# Fork-only, one click after an upstream update: merge beppe2880/opencode-mobile into this
# fork, then build the APK from the merged tree, so upstream changes and the fork's own
# changes (see FORK.md) are both in the build.
#
# The merge is pushed back to the branch when the token may do so. Without a token that can
# change workflow files (secret UPSTREAM_SYNC_TOKEN), the push is skipped: the APK is still
# built from the merged tree, and the run warns. A conflicting merge stops before building:
# resolve it locally, push, then use "Build APK".

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream branch or tag to merge"
        type: string
        required: false
        default: main
      build_type:
        description: "What to build (auto: release when the signing secrets are set)"
        type: choice
        default: auto
        options: [auto, debug, release, both]
      push:
        description: "Push the merge back to this branch"
        type: boolean
        default: true
  schedule:
    # Weekly check for upstream changes; it only builds when there was something to merge.
    - cron: "0 6 * * 1"

concurrency:
  group: sync-and-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-and-build:
    name: Sync and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      - name: Merge upstream
        id: merge
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
          SHOULD_PUSH: ${{ github.event_name == 'schedule' || inputs.push }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/beppe2880/opencode-mobile.git
          git fetch --no-tags upstream "$UPSTREAM_REF"
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date with upstream/$UPSTREAM_REF."
            echo "state=uptodate" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge --no-edit --no-ff FETCH_HEAD; then
            git merge --abort || true
            echo "::error::Conflicts with upstream/$UPSTREAM_REF. Resolve them locally, push, then run Build APK."
            exit 1
          fi
          echo "state=merged" >> "$GITHUB_OUTPUT"
          if [ "$SHOULD_PUSH" != "true" ]; then
            echo "Not pushing: push was not requested."
          elif ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "::warning::Could not push the merge; the APK is built from the merged tree. Set UPSTREAM_SYNC_TOKEN to keep the merge on the branch."
          fi

      - name: Work out what to build
        id: build
        if: github.event_name != 'schedule' || steps.merge.outputs.state == 'merged'
        env:
          REQUESTED: ${{ inputs.build_type || 'auto' }}
          KEYSTORE_BASE64: ${{ secrets.OCM_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          signed=false
          if [ -n "$KEYSTORE_BASE64" ]; then signed=true; fi
          debug=false
          release=false
          case "$REQUESTED" in
            auto) if [ "$signed" = true ]; then release=true; else debug=true; fi ;;
            debug) debug=true ;;
            release) release=true ;;
            both) debug=true; release=true ;;
            *) echo "::error::Unknown build type $REQUESTED"; exit 1 ;;
          esac
          if [ "$release" = true ] && [ "$signed" != true ]; then
            echo "::warning::Release signing secrets are missing; building the debug APK instead."
            release=false
            debug=true
          fi
          echo "debug=$debug" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Restore the signing key
        if: steps.build.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.OCM_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build the debug APK
        if: steps.build.outputs.debug == 'true'
        working-directory: android
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Build the release APK
        if: steps.build.outputs.release == 'true'
        working-directory: android
        env:
          OCM_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          OCM_KEYSTORE_PASSWORD: ${{ secrets.OCM_KEYSTORE_PASSWORD }}
          OCM_KEY_ALIAS: ${{ secrets.OCM_KEY_ALIAS }}
          OCM_KEY_PASSWORD: ${{ secrets.OCM_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Collect the APKs
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < version.txt)"
          short="${GITHUB_SHA:0:7}"
          mkdir -p dist
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk "dist/OpenCode-Mobile-$version-$short-debug.apk"
          fi
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/OpenCode-Mobile-$version-$short-release.apk"
          fi
          (cd dist && sha256sum -- *.apk > SHA256SUMS)
          ls -lh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.build.outcome == 'success'
        with:
          name: apk-synced-${{ github.run_number }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error
