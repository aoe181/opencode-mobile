name: Sync and build APK

# Fork-only, one click after an upstream update: merge beppe2880/opencode-mobile into this
# fork, then build the release APK (R8, minified and resource-shrunk) from the merged tree, so
# upstream changes and the fork's own changes (see FORK.md) are both in the build.
#
# The merge is pushed back to the branch when the token may do so. Without a token that can
# change workflow files (secret UPSTREAM_SYNC_TOKEN) the push is skipped: the APK is still
# built from the merged tree, and the run warns. A conflicting merge stops before building:
# resolve it locally, push, then use "Build APK".
#
# Signing: with the OCM_KEYSTORE_* / OCM_KEY_* secrets set, the APK is signed with the release
# key and upgrades an installed release build; without them it is signed with the debug key.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream branch or tag to merge"
        type: string
        required: false
        default: main
      push:
        description: "Push the merge back to this branch"
        type: boolean
        default: true
  schedule:
    # Weekly check for upstream changes; it only builds when there was something to merge.
    - cron: "0 6 * * 1"

concurrency:
  group: sync-and-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-and-build:
    name: Sync and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      - name: Merge upstream
        id: merge
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
          SHOULD_PUSH: ${{ github.event_name == 'schedule' || inputs.push }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/beppe2880/opencode-mobile.git
          git fetch --no-tags upstream "$UPSTREAM_REF"
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date with upstream/$UPSTREAM_REF."
            echo "state=uptodate" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge --no-edit --no-ff FETCH_HEAD; then
            git merge --abort || true
            echo "::error::Conflicts with upstream/$UPSTREAM_REF. Resolve them locally, push, then run Build APK."
            exit 1
          fi
          echo "state=merged" >> "$GITHUB_OUTPUT"
          if [ "$SHOULD_PUSH" != "true" ]; then
            echo "Not pushing: push was not requested."
          elif ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "::warning::Could not push the merge; the APK is built from the merged tree. Set UPSTREAM_SYNC_TOKEN to keep the merge on the branch."
          fi

      - name: Skip the build when nothing changed
        if: github.event_name == 'schedule' && steps.merge.outputs.state == 'uptodate'
        run: echo "Nothing new upstream, no APK to build."

      - name: Prepare the signing key
        id: signing
        if: github.event_name != 'schedule' || steps.merge.outputs.state == 'merged'
        env:
          KEYSTORE_BASE64: ${{ secrets.OCM_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.OCM_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.OCM_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.OCM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            {
              echo "OCM_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "OCM_KEYSTORE_PASSWORD=$RELEASE_STORE_PASSWORD"
              echo "OCM_KEY_ALIAS=$RELEASE_KEY_ALIAS"
              echo "OCM_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning::OCM_KEYSTORE_BASE64 is not set: signing the APK with the debug keystore."
            {
              echo "OCM_KEYSTORE_FILE=$GITHUB_WORKSPACE/android/debug.keystore"
              echo "OCM_KEYSTORE_PASSWORD=android"
              echo "OCM_KEY_ALIAS=androiddebugkey"
              echo "OCM_KEY_PASSWORD=android"
            } >> "$GITHUB_ENV"
          fi

      - name: Build the release APK
        if: github.event_name != 'schedule' || steps.merge.outputs.state == 'merged'
        working-directory: android
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Collect the APK
        id: collect
        if: github.event_name != 'schedule' || steps.merge.outputs.state == 'merged'
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < version.txt)"
          short="${GITHUB_SHA:0:7}"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/OpenCode-Mobile-$version-$short.apk"
          (cd dist && sha256sum -- *.apk > SHA256SUMS)
          ls -lh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.collect.outcome == 'success'
        with:
          name: apk-synced-${{ github.run_number }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error
