name: Build APK

# Fork-only helper: build an installable APK from the current branch with one click, and keep
# it as a downloadable artifact of the run. Nothing is published and no release is created,
# so it also works where the upstream release workflow skips forks.
#
# After syncing the fork with upstream (see FORK.md), run this workflow from the Actions tab
# and download the APK from the run; that is the whole rebuild.
#
# Signing: with the OCM_KEYSTORE_* / OCM_KEY_* secrets set, a release APK signed with the
# release key is built (it upgrades an installed release build). Without them a debug APK is
# built, which installs beside the release one (applicationId suffix `.debug`).

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "What to build (auto: release when the signing secrets are set)"
        type: choice
        default: auto
        options: [auto, debug, release, both]
      version_name:
        description: "Version name (empty: version.txt from the synced upstream)"
        type: string
        required: false
        default: ""
  push:
    tags: ["v*"]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      - name: Work out what to build
        id: build
        env:
          REQUESTED: ${{ inputs.build_type || 'auto' }}
          KEYSTORE_BASE64: ${{ secrets.OCM_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          signed=false
          if [ -n "$KEYSTORE_BASE64" ]; then signed=true; fi
          debug=false
          release=false
          case "$REQUESTED" in
            auto) if [ "$signed" = true ]; then release=true; else debug=true; fi ;;
            debug) debug=true ;;
            release) release=true ;;
            both) debug=true; release=true ;;
            *) echo "::error::Unknown build type $REQUESTED"; exit 1 ;;
          esac
          # A release APK without the signing secrets would only be debug-signed: build the
          # debug one instead, which at least installs beside the release app.
          if [ "$release" = true ] && [ "$signed" != true ]; then
            echo "::warning::Release signing secrets are missing; building the debug APK instead."
            release=false
            debug=true
          fi
          echo "debug=$debug" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Restore the signing key
        if: steps.build.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.OCM_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build the debug APK
        if: steps.build.outputs.debug == 'true'
        working-directory: android
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Build the release APK
        if: steps.build.outputs.release == 'true'
        working-directory: android
        env:
          OCM_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          OCM_KEYSTORE_PASSWORD: ${{ secrets.OCM_KEYSTORE_PASSWORD }}
          OCM_KEY_ALIAS: ${{ secrets.OCM_KEY_ALIAS }}
          OCM_KEY_PASSWORD: ${{ secrets.OCM_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          if [ -n "$VERSION_NAME" ]; then
            ./gradlew :app:assembleRelease -PversionName="$VERSION_NAME" --console=plain
          else
            ./gradlew :app:assembleRelease --console=plain
          fi

      - name: Collect the APKs
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < version.txt)"
          short="${GITHUB_SHA:0:7}"
          mkdir -p dist
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk "dist/OpenCode-Mobile-$version-$short-debug.apk"
          fi
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/OpenCode-Mobile-$version-$short-release.apk"
          fi
          (cd dist && sha256sum -- *.apk > SHA256SUMS)
          ls -lh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-${{ github.ref_name }}-${{ github.run_number }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error
