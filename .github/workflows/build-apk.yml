name: Build APK

# Fork-only helper: build the release APK (R8, minified and resource-shrunk) from the branch
# with one click, and keep it as a downloadable artifact of the run. Nothing is published and
# no release is created, so it also works where the upstream release workflow skips forks.
#
# After syncing the fork with upstream (see FORK.md), run this workflow from the Actions tab
# and download the APK from the run; that is the whole rebuild.
#
# Signing: the OCM_KEYSTORE_* / OCM_KEY_* secrets sign it with the release key, so it upgrades
# an installed release build. Without them the repository's debug keystore signs it: it still
# installs over an earlier build signed the same way, but not over a release-key one.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (empty: version.txt from the synced upstream)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  apk:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      # The build refuses a release build in CI with no signing config at all, so without the
      # release secrets the repository's debug keystore signs the APK instead.
      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OCM_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.OCM_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.OCM_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.OCM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            {
              echo "OCM_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "OCM_KEYSTORE_PASSWORD=$RELEASE_STORE_PASSWORD"
              echo "OCM_KEY_ALIAS=$RELEASE_KEY_ALIAS"
              echo "OCM_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning::OCM_KEYSTORE_BASE64 is not set: signing the APK with the debug keystore."
            {
              echo "OCM_KEYSTORE_FILE=$GITHUB_WORKSPACE/android/debug.keystore"
              echo "OCM_KEYSTORE_PASSWORD=android"
              echo "OCM_KEY_ALIAS=androiddebugkey"
              echo "OCM_KEY_PASSWORD=android"
            } >> "$GITHUB_ENV"
          fi

      - name: Build the release APK
        working-directory: android
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          if [ -n "$VERSION_NAME" ]; then
            ./gradlew :app:assembleRelease -PversionName="$VERSION_NAME" --console=plain
          else
            ./gradlew :app:assembleRelease --console=plain
          fi

      - name: Collect the APK
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < version.txt)"
          short="${GITHUB_SHA:0:7}"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/OpenCode-Mobile-$version-$short.apk"
          (cd dist && sha256sum -- *.apk > SHA256SUMS)
          ls -lh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-${{ github.ref_name }}-${{ github.run_number }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error
